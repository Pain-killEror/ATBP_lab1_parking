name: CI Tests

on:
  push:
    branches: [ lab-6 ]
  pull_request:
    branches: [ lab-6 ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Start Server and Run Tests
      run: |
        node server.js &
        npx playwright test