name: CI Pipeline

on:
  push:
    branches: [ lab-6 ]
  pull_request:
    branches: [ lab-6 ]

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Тестируем на версиях 18 и 20, как просит лаба
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci # Установка из package-lock для стабильности

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Start server
      run: |
        npm start &
        npx playwright test # Запуск тестов

    - name: Upload Allure Results
      if: always() # Сохраняем отчет даже если тесты упали
      uses: actions/upload-artifact@v4
      with:
        name: allure-results-node-${{ matrix.node-version }}
        path: allure-results/